<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Terra · Crop plans for a hotter, drier world</title>
  <meta name="description" content="Test thousands of crop rotations against 20 years of NASA data for any field. Fine-tuned for Arizona: water cuts, groundwater rules, heat and real crop budgets.">
  <meta name="theme-color" content="#0e0f0c">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <button class="brand" data-act="home" aria-label="Terra home"><img src="assets/icon.svg" alt="" width="36" height="36"></button>
      <nav class="rail-nav" id="railNav"></nav>
      <button class="lang" id="langRail" aria-label="Language"></button>
    </aside>

    <header class="topbar">
      <button class="brand" data-act="home"><img src="assets/icon.svg" alt="" width="30" height="30"><span>terra</span></button>
      <div class="top-actions">
        <button class="icon-btn" data-act="tour" aria-label="How to use Terra"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.5"/></svg></button>
        <button class="lang" id="langTop" aria-label="Language"></button>
      </div>
    </header>

    <main>
      <section class="screen" id="screen-field" data-screen="field">
        <div class="field-grid">
          <div class="map-card">
            <div id="map"></div>
            <div class="map-top">
              <button class="place-chip" id="placeChip"></button>
            </div>
            <div class="map-pills" id="layers" role="radiogroup"></div>
            <div class="map-legend" id="mapLegend" hidden></div>
          </div>
          <div class="field-side" id="fieldSide"></div>
        </div>
      </section>
      <section class="screen" id="screen-plans" data-screen="plans" hidden></section>
      <section class="screen" id="screen-build" data-screen="build" hidden></section>
      <section class="screen" id="screen-saved" data-screen="saved" hidden></section>
      <section class="screen" id="screen-learn" data-screen="learn" hidden></section>
    </main>

    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
  </div>

  <div class="setup" id="setup" hidden></div>
  <div class="landing" id="landing" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
