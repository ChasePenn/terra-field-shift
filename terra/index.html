<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Terra · Crop rotations for a drier Arizona</title>
  <meta name="description" content="Pick your field, see how each crop rotation would have done in the last 20 years of NASA weather, and build your own.">
  <meta name="theme-color" content="#0e0f0c">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <a class="brand" href="#field" aria-label="Terra"><img src="assets/icon.svg" alt="" width="36" height="36"></a>
      <nav class="rail-nav" id="railNav"></nav>
      <button class="lang" id="langRail" aria-label="Language"></button>
    </aside>

    <header class="topbar">
      <a class="brand" href="#field"><img src="assets/icon.svg" alt="" width="30" height="30"><span>terra</span></a>
      <div class="top-actions">
        <button class="lang" id="langTop" aria-label="Language"></button>
      </div>
    </header>

    <main>
      <section class="screen" id="screen-field" data-screen="field">
        <div class="field-grid">
          <div class="map-card">
            <div id="map"></div>
            <div class="map-top">
              <button class="place-chip" id="placeChip"></button>
            </div>
            <div class="map-pills" id="layers" role="radiogroup"></div>
            <div class="map-legend" id="mapLegend" hidden></div>
          </div>
          <div class="field-side" id="fieldSide"></div>
        </div>
      </section>
      <section class="screen" id="screen-plans" data-screen="plans" hidden></section>
      <section class="screen" id="screen-build" data-screen="build" hidden></section>
      <section class="screen" id="screen-learn" data-screen="learn" hidden></section>
    </main>

    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
  </div>

  <div class="setup" id="setup" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
